name: Import source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import.yml']

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Import full source tree in one commit
        run: |
          curl -fL --retry 3 -o src.zip https://aka.doubaocdn.com/s/V8vcqUsuPV
          mkdir src && unzip -q src.zip -d src
          (cd src && tar cf - --exclude=.git .) | tar xf - -C "$GITHUB_WORKSPACE"
          git rm -rq --ignore-unmatch ci-logs ci-artifact .github/workflows/import.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat: Lynx full source in standard SwiftPM layout"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      - name: Trigger build (GITHUB_TOKEN push does not fire push events)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main

      - name: Upload failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOB_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[0].id')
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > job.log 2>/dev/null || true
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/ci-logs/import.log" --jq .sha 2>/dev/null || true)
          jq -n --arg c "$(base64 -w0 job.log)" --arg s "$SHA" \
            '{message:"ci: import failure log", content:$c, branch:"main"} + (if $s != "" then {sha:$s} else {} end)' \
            | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci-logs/import.log" --input -
